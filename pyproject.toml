[project]
name = "nano-harness"
version = "0.0.1"
description = "Smallest readable coding-agent loop that scores on benchmarks."
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.120.2",
  "openai==2.50.0",
  "pydantic==2.13.4",
  "rich==15.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.0"]
eval = ["harbor==0.20.0", "swebench==4.1.0"]
# Workflows pin the exact treatment version.  The host-owned central runtime is
# compatible with both the frozen 2.2.8 comparator and the current 2.3 series.
miniswe = ["mini-swe-agent==2.4.6"]
# GroundTruth evidence engine (gt_engine/). The distribution is named
# groundtruth-mcp (import name: groundtruth); it is not on PyPI - install from
# the local checkout: `pip install -e D:\Groundtruth`. groundtruth-mcp declares
# requires-python >=3.11; nano's >=3.12 is the binding constraint here.
# numpy: required by the task-start v1r brief leg (pretask.anchor_select);
# absent, the brief abstains correct-or-quiet and every other GT path still runs.
gt = ["groundtruth-mcp==1.0.0", "numpy==2.5.1"]
# Local dense retrieval used by the ARB workflow and optional runtime seam.
# The model weights are separately content-addressed; these are inference-only
# packages and never contact a provider.
retrieval = [
  "numpy==2.5.1",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
]

[project.scripts]
nano = "nano.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano", "eval", "gt_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "gt_all17: deterministic ten-trigger campaign covering all 17 GT identities",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
