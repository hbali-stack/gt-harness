# Replicate campaign: an ordered queue of replicates for ONE account, run strictly one at a time.
#
# Each queue entry is one replicate (benchmark, arm, rep) run at `parallel` (default 20 = the
# account's whole runner pool), so each replicate finishes as fast as the account allows and
# the next starts when it is done. TB2 entries run first, then DeepSWE entries, each in the
# order given. An entry may carry its own task list (the tasks still missing from a replicate
# that was interrupted); otherwise it runs the full longest-first order
# (config/replicate_task_order.json).
#
# The baseline arm is GT-off: dispatch only on the user's explicit instruction
# (standing rule), which confirm_baseline records.
name: Replicate campaign (DeepSWE + TB2, GT and baseline)
run-name: Replicates ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'JSON list of {"bench":"deepswe|tb2","arm":"gt|baseline","rep":N,"tasks":[...optional]}, run one at a time'
        required: true
        default: "[]"
      label:
        description: Short run label (shown in the run name)
        required: false
        default: ""
      model:
        description: Model id (OpenRouter)
        required: true
        default: stealth/space-bunny-alpha
      parallel:
        description: Concurrent task jobs for the replicate being run (20 = the whole account)
        required: true
        default: "20"
      confirm_baseline:
        description: 'Type "user-approved" - the user explicitly instructed GT-off baseline runs'
        required: true
        default: ""

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deepswe: ${{ steps.order.outputs.deepswe }}
      tb2: ${{ steps.order.outputs.tb2 }}
    steps:
      - uses: actions/checkout@v4
      - id: order
        env:
          QUEUE: ${{ inputs.queue }}
          CONFIRM: ${{ inputs.confirm_baseline }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          order = json.load(open("config/replicate_task_order.json", encoding="utf-8"))
          queue = json.loads(os.environ["QUEUE"])
          cells = {"deepswe": [], "tb2": []}
          for entry in queue:
              bench, arm, rep = entry["bench"], entry["arm"], entry["rep"]
              if bench not in cells or arm not in ("gt", "baseline") or not (isinstance(rep, int) and rep > 0):
                  raise SystemExit(f"bad queue entry {entry!r}")
              if arm == "baseline" and os.environ["CONFIRM"] != "user-approved":
                  raise SystemExit("baseline arm needs confirm_baseline=user-approved (user's explicit instruction)")
              full = [t["task"] for t in order[bench]]
              tasks = entry.get("tasks") or full
              unknown = [t for t in tasks if t not in full]
              if unknown:
                  raise SystemExit(f"{bench} tasks not in the task order: {unknown}")
              tasks = [t for t in full if t in set(tasks)]  # keep longest-first
              cells[bench].append({"arm": arm, "rep": str(rep), "tasks": json.dumps(tasks), "n": len(tasks)})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for bench, rows in cells.items():
                  out.write(f"{bench}=" + json.dumps(rows) + "\n")
                  print(bench, [(r["arm"], r["rep"], r["n"]) for r in rows])
          PY

  tb2:
    needs: order
    if: needs.order.outputs.tb2 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.order.outputs.tb2) }}
    uses: ./.github/workflows/tb2_thin_gt.yml
    with:
      tasks: ${{ matrix.tasks }}
      model: ${{ inputs.model }}
      parallel: ${{ inputs.parallel }}
      arm: ${{ matrix.arm }}
      rep: ${{ matrix.rep }}
      image_owner: harneet2512
    secrets: inherit

  deepswe:
    needs: [order, tb2]
    if: always() && needs.order.result == 'success' && needs.order.outputs.deepswe != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.order.outputs.deepswe) }}
    uses: ./.github/workflows/deepswe_thin_gt.yml
    with:
      tasks: ${{ matrix.tasks }}
      model: ${{ inputs.model }}
      step_limit: "300"
      parallel: ${{ inputs.parallel }}
      arm: ${{ matrix.arm }}
      rep: ${{ matrix.rep }}
      image_owner: harneet2512
    secrets: inherit
